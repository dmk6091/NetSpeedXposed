name: Maharashtra dams
on:
  schedule:
    - cron: '20 2,4 * * *'   # 07:50 and 09:50 IST, after the department's morning update
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch today's report
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sSL --connect-timeout 20 --max-time 90 --retry 2 -A "Mozilla/5.0 (FieldAtlas dam data)" -o report.pdf -w "http %{http_code} %{size_download} bytes\n" "https://mwrdpravah.in/damsafety/control/pdfLatestReportEng" || echo "curl failed $?"
          ls -l report.pdf || true; head -c 8 report.pdf || true; echo
          pdftotext -layout report.pdf report.txt || true
          wc -l report.txt || true
      - name: Keep the raw report for checking
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dams >/dev/null 2>&1 || gh release create dams --title "Maharashtra dam readings" --notes "Daily readings from the Maharashtra Water Resources Department report, read by the app."
          [ -s report.txt ] && gh release upload dams report.txt --clobber || echo "no report text"
      - name: Convert to JSON
        run: python3 tools/dams_parse.py report.txt data/mh_dams_coords.csv mh_dams.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dams >/dev/null 2>&1 || gh release create dams --title "Maharashtra dam readings" --notes "Daily readings from the Maharashtra Water Resources Department report, read by the app." 
          gh release upload dams mh_dams.json --clobber
