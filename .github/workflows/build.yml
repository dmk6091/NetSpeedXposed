name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NetSpeedXposed.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: NetSpeedXposed
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|e: |FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Build the NetSwitch Magisk module
        run: |
          mkdir -p nsout
          javac --release 8 -d nsout netswitch/NetHelper.java
          D8=$(ls $ANDROID_HOME/build-tools/*/d8 | sort -V | tail -n1)
          $D8 --min-api 26 --output netswitch/helper.jar nsout/*.class
          cd netswitch
          zip -qr ../NetSwitch.zip . -x NetHelper.java
          unzip -l ../NetSwitch.zip
      - name: Build the Immersive Navigation Magisk module
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          AJ=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n1)/android.jar
          mkdir -p inav_out immersivenav/system/product/overlay
          $BT/aapt2 compile --dir immersivenav/overlay/res -o inav_out/res.zip
          $BT/aapt2 link -o inav_out/unsigned.apk -I "$AJ" --manifest immersivenav/overlay/AndroidManifest.xml \
            --min-sdk-version 29 --target-sdk-version 35 inav_out/res.zip
          keytool -genkeypair -keystore inav_out/k.jks -storepass netspeed -keypass netspeed -alias k \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NetSpeed"
          $BT/zipalign -f 4 inav_out/unsigned.apk inav_out/aligned.apk
          $BT/apksigner sign --ks inav_out/k.jks --ks-pass pass:netspeed --key-pass pass:netspeed \
            --out immersivenav/system/product/overlay/ImmersiveNav.apk inav_out/aligned.apk
          chmod 755 immersivenav/service.sh immersivenav/uninstall.sh
          (cd immersivenav && zip -qr ../ImmersiveNav.zip META-INF module.prop service.sh uninstall.sh system)
          unzip -l ImmersiveNav.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeedXposed-apk
          path: |
            NetSpeedXposed/app/build/outputs/apk/release/*.apk
            NetSpeedXposed/wifiactivity/build/outputs/apk/release/*.apk
      - name: Publish as the "latest" release (used by the app's Update button)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp NetSpeedXposed/app/build/outputs/apk/release/*.apk NetSpeedXposed.apk
          cp NetSpeedXposed/wifiactivity/build/outputs/apk/release/*.apk WiFiActivity.apk
          printf 'build=%s\n%s\n' "$((GITHUB_RUN_NUMBER + 1000))" "$MSG" > notes.txt
          R=${{ github.repository }}
          # update.json: the KernelSU/Magisk manager reads this to offer the module update
          MV=$(sed -n 's/^version=//p' netswitch/module.prop)
          MC=$(sed -n 's/^versionCode=//p' netswitch/module.prop)
          BASE="https://github.com/$R/releases/download/latest"
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "%s/NetSwitch.zip",\n  "changelog": "%s/changelog.md"\n}\n' "$MV" "$MC" "$BASE" "$BASE" > update.json
          printf '%s\n' "$MSG" > changelog.md
          cat update.json
          if gh release view latest -R "$R" >/dev/null 2>&1; then
            gh release upload latest NetSpeedXposed.apk WiFiActivity.apk NetSwitch.zip ImmersiveNav.zip update.json changelog.md --clobber -R "$R"
            gh release edit latest --notes-file notes.txt -R "$R"
          else
            gh release create latest NetSpeedXposed.apk WiFiActivity.apk NetSwitch.zip ImmersiveNav.zip update.json changelog.md --title "Latest build" --notes-file notes.txt -R "$R"
          fi
