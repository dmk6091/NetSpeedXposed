name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - run: unzip -q NetSpeedXposed.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: NetSpeedXposed
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|e: |FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Build the NetSwitch Magisk module
        run: |
          mkdir -p nsout
          javac --release 8 -d nsout netswitch/NetHelper.java
          D8=$(ls $ANDROID_HOME/build-tools/*/d8 | sort -V | tail -n1)
          $D8 --min-api 26 --output netswitch/helper.jar nsout/*.class
          cd netswitch
          zip -qr ../NetSwitch.zip . -x NetHelper.java
          unzip -l ../NetSwitch.zip
      - name: Build the Immersive Navigation Magisk module
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          AJ=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n1)/android.jar
          mkdir -p inav_out immersivenav/system/product/overlay
          $BT/aapt2 compile --dir immersivenav/overlay/res -o inav_out/res.zip
          $BT/aapt2 link -o inav_out/unsigned.apk -I "$AJ" --manifest immersivenav/overlay/AndroidManifest.xml \
            --min-sdk-version 29 --target-sdk-version 35 inav_out/res.zip
          keytool -genkeypair -keystore inav_out/k.jks -storepass netspeed -keypass netspeed -alias k \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NetSpeed"
          $BT/zipalign -f 4 inav_out/unsigned.apk inav_out/aligned.apk
          $BT/apksigner sign --ks inav_out/k.jks --ks-pass pass:netspeed --key-pass pass:netspeed \
            --out immersivenav/system/product/overlay/ImmersiveNav.apk inav_out/aligned.apk
          chmod 755 immersivenav/service.sh immersivenav/uninstall.sh
          (cd immersivenav && zip -qr ../ImmersiveNav.zip META-INF module.prop service.sh uninstall.sh system)
          unzip -l ImmersiveNav.zip
      - name: Build the Volume Steps Magisk module
        run: |
          cd volumesteps
          zip -qr ../VolumeSteps.zip .
          unzip -l ../VolumeSteps.zip
      - name: Build the NFC Off Magisk module
        run: |
          cd nfcoff
          zip -qr ../NfcOff.zip .
          unzip -l ../NfcOff.zip
      - name: Build the Ride Cool Magisk module
        run: |
          cd ridecool
          zip -qr ../RideCool.zip .
          unzip -l ../RideCool.zip
      - name: Build the Clean Boot Magisk module
        run: |
          cd cleanboot
          zip -qr ../CleanBoot.zip .
          unzip -l ../CleanBoot.zip
      - name: Build the Net Boost Magisk module
        run: |
          cd netboost
          zip -qr ../NetBoost.zip .
          unzip -l ../NetBoost.zip
      - name: Build the Touch Rate 240 Magisk module
        run: |
          cd touch240
          chmod 755 bin/xt service.sh uninstall.sh
          zip -qr ../Touch240.zip .
          unzip -l ../Touch240.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeedXposed-apk
          path: |
            NetSpeedXposed/app/build/outputs/apk/release/*.apk
            NetSpeedXposed/wifiactivity/build/outputs/apk/release/*.apk
            NetSpeedXposed/sliderpercent/build/outputs/apk/release/*.apk
            NetSpeedXposed/immersivenav/build/outputs/apk/release/*.apk
            NetSpeedXposed/autodataswitch/build/outputs/apk/release/*.apk
            NetSpeedXposed/screenres/build/outputs/apk/release/*.apk
            NetSpeedXposed/btbatfix/build/outputs/apk/release/*.apk
            NetSpeedXposed/ostweaks/build/outputs/apk/release/*.apk
      - name: Publish as the "latest" release (used by the app's Update button)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp NetSpeedXposed/app/build/outputs/apk/release/*.apk FieldAtlas.apk
          cp FieldAtlas.apk NetSpeedXposed.apk   # old name kept so installed builds can still update
          cp NetSpeedXposed/wifiactivity/build/outputs/apk/release/*.apk WiFiActivity.apk
          cp NetSpeedXposed/sliderpercent/build/outputs/apk/release/*.apk SliderPercent.apk
          cp NetSpeedXposed/immersivenav/build/outputs/apk/release/*.apk ImmersiveNavX.apk
          cp NetSpeedXposed/autodataswitch/build/outputs/apk/release/*.apk AutoDataSwitch.apk
          cp NetSpeedXposed/screenres/build/outputs/apk/release/*.apk ScreenRes.apk
          cp NetSpeedXposed/btbatfix/build/outputs/apk/release/*.apk BtBatteryFix.apk
          cp NetSpeedXposed/ostweaks/build/outputs/apk/release/*.apk OxygenOSTweaks.apk
          printf 'build=%s\n%s\n' "$((GITHUB_RUN_NUMBER + 1000))" "$MSG" > notes.txt
          # the changes of the builds just before this one too, so skipping an update doesn't lose its notes
          { echo; echo "Earlier builds:"; git log -n 12 --skip=1 --pretty='- %s'; } >> notes.txt || true
          R=${{ github.repository }}
          # update.json: the KernelSU/Magisk manager reads this to offer the module update
          MV=$(sed -n 's/^version=//p' netswitch/module.prop)
          MC=$(sed -n 's/^versionCode=//p' netswitch/module.prop)
          BASE="https://github.com/$R/releases/download/latest"
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "%s/NetSwitch.zip",\n  "changelog": "%s/changelog.md"\n}\n' "$MV" "$MC" "$BASE" "$BASE" > update.json
          printf '%s\n' "$MSG" > changelog.md
          cat update.json
          # "latest" keeps only what the app and the NetSwitch update link need
          if gh release view latest -R "$R" >/dev/null 2>&1; then
            gh release upload latest FieldAtlas.apk --clobber -R "$R"
            for f in NetSpeedXposed.apk NetSwitch.zip update.json changelog.md; do gh release upload latest "$f" --clobber -R "$R" || echo "skip $f"; done
            gh release edit latest --notes-file notes.txt -R "$R"
          else
            gh release create latest FieldAtlas.apk NetSpeedXposed.apk NetSwitch.zip update.json changelog.md --title "Field Atlas (latest build)" --notes-file notes.txt -R "$R"
          fi
          for a in WiFiActivity.apk SliderPercent.apk ImmersiveNavX.apk AutoDataSwitch.apk ScreenRes.apk BtBatteryFix.apk OxygenOSTweaks.apk ImmersiveNav.zip VolumeSteps.zip NfcOff.zip RideCool.zip CleanBoot.zip NetBoost.zip Touch240.zip; do
            gh release delete-asset latest "$a" -y -R "$R" >/dev/null 2>&1 || true
          done
          cat > notes_aosp.md <<'EON'
          Modules for AOSP-based ROMs (Lunaris and similar). Install the zips from the root manager (Modules > Install, then reboot).

          - NetBoost.zip: BBR + fq, TCP Fast Open, bigger buffers, ECN, MTU probing
          - VolumeSteps.zip: finer or coarser volume steps for every stream
          - NfcOff.zip: stops the NFC driver once after boot (for ROMs where it loops)
          - Touch240.zip: 240 Hz touch reporting (Poco F7 only)
          - RideCool.zip: optional stepwise heat caps and slower charging (Xiaomi thermal files)
          - CleanBoot.zip: hides traces a custom ROM leaves on a Xiaomi phone
          - WiFiActivity.apk: Wi-Fi in/out arrows in the Wi-Fi icon (LSPosed)

          Field Atlas itself is in the "Field Atlas (latest build)" release.
          EON
          cat > notes_other.md <<'EON'
          Modules for other ROMs (HyperOS, OxygenOS / ColorOS). Not needed on an AOSP ROM with Field Atlas.

          - NetSwitch.zip (HyperOS): 5G weak to 4G, SIM 1 weak to SIM 2 via the hidden auto data switch
          - AutoDataSwitch.apk (HyperOS): brings back "Switch mobile data automatically"
          - ScreenRes.apk (HyperOS): screen resolution, DC dimming, glove mode
          - SliderPercent.apk (OxygenOS / ColorOS): percent on brightness and volume sliders
          - OxygenOSTweaks.apk (OxygenOS / ColorOS): VoNR / VoLTE icons, Eye Care, IMS status
          - BtBatteryFix.apk: Bluetooth headset battery after reboot (for StatusbarTemp)
          - ImmersiveNav.zip, ImmersiveNavX.apk: gesture navigation edge-to-edge (Field Atlas already does this)
          EON

          rel() { # tag title notes files...
            t=$1; ti=$2; nf=$3; shift 3
            if gh release view "$t" -R "$R" >/dev/null 2>&1; then
              gh release upload "$t" "$@" --clobber -R "$R"; gh release edit "$t" --title "$ti" --notes-file "$nf" -R "$R"
            else
              gh release create "$t" "$@" --title "$ti" --notes-file "$nf" -R "$R"
            fi
          }
          rel modules-aosp "Modules for AOSP ROMs" notes_aosp.md NetBoost.zip VolumeSteps.zip NfcOff.zip Touch240.zip RideCool.zip CleanBoot.zip WiFiActivity.apk
          rel modules-other "Modules for HyperOS / OxygenOS" notes_other.md ImmersiveNav.zip ImmersiveNavX.apk AutoDataSwitch.apk ScreenRes.apk SliderPercent.apk OxygenOSTweaks.apk BtBatteryFix.apk
