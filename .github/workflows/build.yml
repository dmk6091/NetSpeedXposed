name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NetSpeedXposed.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: NetSpeedXposed
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NetSpeedXposed-apk
          path: NetSpeedXposed/app/build/outputs/apk/release/*.apk
      - name: Package status bar height module
        run: cd SbHeight && zip -rq ../SbHeight.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: SbHeight-module
          path: SbHeight/
