plugins {
    id 'com.android.application'
}

android {
    namespace 'com.netspeed.xposed'
    compileSdk 35

    defaultConfig {
        applicationId 'com.netspeed.xposed'
        minSdk 30
        targetSdk 35
        // Build number from GitHub Actions, so every build is newer than the last.
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1') + 1000
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: 'local')
    }

    // Fixed key so every build can update the previous one in place.
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'netspeedxposed'
            keyAlias 'netspeed'
            keyPassword 'netspeedxposed'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API (bundled stub jar): only needed to compile; LSPosed provides the real one on the phone.
    compileOnly files('libs/xposed-api-82-stubs.jar')
    // Hidden system APIs (app suggestions service): compile only, the phone has the real ones.
    compileOnly project(':sysstubs')
}
